<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPU Framework Tests</title>
    <style>
        body {
            font-family: monospace;
            background: #1a1a1a;
            color: #e0e0e0;
            padding: 20px;
            margin: 0;
        }
        pre {
            white-space: pre-wrap;
            line-height: 1.5;
        }
        canvas {
            display: none;
        }
        .filter-controls {
            font-family: system-ui, -apple-system, sans-serif;
            background: #2d2d44;
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .filter-controls label {
            font-size: 14px;
            font-weight: 500;
        }
        .filter-controls input[type="text"] {
            background: #1a1a2e;
            border: 1px solid #4a4a6a;
            border-radius: 4px;
            padding: 8px 12px;
            color: #e0e0e0;
            font-size: 14px;
            width: 300px;
            max-width: 100%;
        }
        .filter-controls input[type="text"]:focus {
            outline: none;
            border-color: #60a5fa;
        }
        .filter-controls button {
            background: #3b82f6;
            border: none;
            border-radius: 4px;
            padding: 8px 16px;
            color: white;
            font-size: 14px;
            cursor: pointer;
            font-weight: 500;
        }
        .filter-controls button:hover {
            background: #2563eb;
        }
        .filter-controls .help {
            font-size: 12px;
            color: #8888aa;
            width: 100%;
            margin-top: 4px;
        }
        .filter-controls .help code {
            background: #1a1a2e;
            padding: 1px 4px;
            border-radius: 2px;
            font-family: monospace;
        }
    </style>
</head>
<body>
    <div class="filter-controls">
        <label for="testFilter">🔍 Filter tests:</label>
        <input type="text" id="testFilter" placeholder="e.g. blueprint, deposit, movement..." />
        <button id="runFiltered">Run</button>
        <button id="runAll" style="background: #6b7280;">Run All</button>
        <div class="help">
            Filter by test name substring. Examples: 
            <code>?test=blueprint</code>, 
            <code>?t=deposit</code>, 
            <code>?test=unit%20moves</code>
        </div>
    </div>
    
    <canvas id="canvas" width="256" height="256"></canvas>
    <pre id="output">Running tests...</pre>
    
    <script>
        // Populate filter from URL and handle filter controls
        const urlParams = new URLSearchParams(window.location.search);
        const currentFilter = urlParams.get('test') || urlParams.get('t') || '';
        document.getElementById('testFilter').value = currentFilter;
        
        document.getElementById('runFiltered').addEventListener('click', () => {
            const filter = document.getElementById('testFilter').value.trim();
            if (filter) {
                window.location.href = `test.html?test=${encodeURIComponent(filter)}`;
            } else {
                window.location.href = 'test.html';
            }
        });
        
        document.getElementById('runAll').addEventListener('click', () => {
            window.location.href = 'test.html';
        });
        
        // Allow Enter key to submit filter
        document.getElementById('testFilter').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                document.getElementById('runFiltered').click();
            }
        });
    </script>
    
    <script type="module" src="src/tests/run-tests.js"></script>
</body>
</html>
