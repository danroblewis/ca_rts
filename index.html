<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CA RTS</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }
        canvas {
            display: block;
            /* Size is set dynamically by JavaScript to maintain square aspect ratio */
            /* Center the canvas */
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
        }
        #cursor-overlay {
            position: fixed;
            pointer-events: none;
            border: 2px solid rgba(255, 80, 80, 0.8);
            background: rgba(255, 50, 50, 0.15);
            box-shadow: 0 0 10px rgba(255, 80, 80, 0.5);
            display: none;
            z-index: 100;
        }
        
        /* Shader Toggle UI */
        #shader-toggle-container {
            position: fixed;
            top: 16px;
            right: 16px;
            z-index: 200;
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 16px;
            border-radius: 8px;
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            font-family: 'SF Mono', 'Monaco', 'Inconsolata', 'Fira Code', monospace;
            font-size: 12px;
            color: #aaa;
            user-select: none;
        }
        
        #shader-toggle-container .label {
            opacity: 0.6;
            transition: opacity 0.2s;
        }
        
        #shader-toggle-container .label.active {
            opacity: 1;
            color: #fff;
        }
        
        .toggle-switch {
            position: relative;
            width: 48px;
            height: 24px;
            cursor: pointer;
        }
        
        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }
        
        .toggle-slider {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, #2a1a3a 0%, #1a2a1a 100%);
            border-radius: 24px;
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }
        
        .toggle-slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 2px;
            bottom: 2px;
            background: linear-gradient(135deg, #8b5cf6 0%, #a855f7 100%);
            border-radius: 50%;
            transition: all 0.3s ease;
            box-shadow: 0 2px 8px rgba(139, 92, 246, 0.4);
        }
        
        .toggle-switch input:checked + .toggle-slider {
            background: linear-gradient(135deg, #1a2a1a 0%, #0a3a2a 100%);
        }
        
        .toggle-switch input:checked + .toggle-slider:before {
            transform: translateX(24px);
            background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);
            box-shadow: 0 2px 8px rgba(34, 197, 94, 0.4);
        }
        
        .toggle-switch:hover .toggle-slider {
            border-color: rgba(255, 255, 255, 0.3);
        }
        
        /* Super Speed Toggle */
        #speed-toggle-container {
            position: fixed;
            top: 70px;
            right: 16px;
            z-index: 200;
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 16px;
            border-radius: 8px;
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            font-family: 'SF Mono', 'Monaco', 'Inconsolata', 'Fira Code', monospace;
            font-size: 12px;
            color: #aaa;
            user-select: none;
        }
        
        #speed-toggle-container .speed-label {
            opacity: 0.8;
        }
        
        #speed-toggle-container .speed-label.active {
            opacity: 1;
            color: #ff6b35;
            text-shadow: 0 0 8px rgba(255, 107, 53, 0.5);
        }
        
        .speed-toggle-switch {
            position: relative;
            width: 48px;
            height: 24px;
            cursor: pointer;
        }
        
        .speed-toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }
        
        .speed-toggle-slider {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            border-radius: 24px;
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }
        
        .speed-toggle-slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 2px;
            bottom: 2px;
            background: linear-gradient(135deg, #555 0%, #777 100%);
            border-radius: 50%;
            transition: all 0.3s ease;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
        }
        
        .speed-toggle-switch input:checked + .speed-toggle-slider {
            background: linear-gradient(135deg, #3a1a0a 0%, #5a2a1a 100%);
            border-color: rgba(255, 107, 53, 0.3);
        }
        
        .speed-toggle-switch input:checked + .speed-toggle-slider:before {
            transform: translateX(24px);
            background: linear-gradient(135deg, #ff6b35 0%, #f7931a 100%);
            box-shadow: 0 2px 10px rgba(255, 107, 53, 0.6);
        }
        
        .speed-toggle-switch:hover .speed-toggle-slider {
            border-color: rgba(255, 255, 255, 0.3);
        }
        
        /* Audio Toggle Button */
        #audio-toggle-container {
            position: fixed;
            top: 124px;
            right: 16px;
            z-index: 200;
        }
        
        #audioToggle {
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 16px;
            border-radius: 8px;
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            font-family: 'SF Mono', 'Monaco', 'Inconsolata', 'Fira Code', monospace;
            font-size: 12px;
            color: #aaa;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        
        #audioToggle:hover {
            background: rgba(30, 30, 30, 0.8);
            border-color: rgba(255, 255, 255, 0.2);
            color: #fff;
        }
        
        #audioToggle.active {
            border-color: rgba(34, 197, 94, 0.5);
            color: #22c55e;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <div id="cursor-overlay"></div>
    
    <!-- Shader Toggle -->
    <div id="shader-toggle-container">
        <span class="label" id="label-pretty">Pretty</span>
        <label class="toggle-switch">
            <input type="checkbox" id="shader-toggle">
            <span class="toggle-slider"></span>
        </label>
    </div>
    
    <!-- Super Speed Toggle -->
    <div id="speed-toggle-container">
        <span class="speed-label" id="speed-label">Speed</span>
        <label class="speed-toggle-switch">
            <input type="checkbox" id="speed-toggle">
            <span class="speed-toggle-slider"></span>
        </label>
    </div>
    
    <!-- Audio Toggle -->
    <div id="audio-toggle-container">
        <button id="audioToggle">🔇 Click for Sound</button>
    </div>
    
    <script type="module" src="src/main.js"></script>
</body>
</html>
