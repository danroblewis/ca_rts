<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CA RTS</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        #cursor-overlay {
            position: fixed;
            pointer-events: none;
            border: 2px solid rgba(255, 80, 80, 0.8);
            background: rgba(255, 50, 50, 0.15);
            box-shadow: 0 0 10px rgba(255, 80, 80, 0.5);
            display: none;
            z-index: 100;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <div id="cursor-overlay"></div>
    
    <script type="module" src="src/main.js"></script>
</body>
</html>
